spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ShopPricer
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        jdbc:
          prepare_threshold: 0
    show-sql: true

logging:
  level:
    root: WARN
    com.example.demo.service.BrandExtractor: DEBUG
    com.example.demo: INFO
    org.hibernate.SQL: DEBUG
